version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
# Hosted uv updates reject the inherited Python >=3.15 baseline. Restore this
# ecosystem after dependabot/dependabot-core#16524 is resolved. Keep the
# dependency graph and OSV scans enabled; use just update-python-dependencies.
