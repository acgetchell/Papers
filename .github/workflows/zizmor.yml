name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '42 18 * * 5'
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: GitHub Actions Security Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-just
        with:
          profile: security
      - name: Audit Actions using the shared tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/security
          uv run --locked --no-sync just security-workflows --require-online --format sarif > target/security/zizmor.sarif
      - name: Upload workflow security analysis
        if: >-
          always() && hashFiles('target/security/zizmor.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: target/security/zizmor.sarif
          category: zizmor
          wait-for-processing: true
